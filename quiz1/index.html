function montaFlow(){
  QUESTIONS.forEach(q=>FLOW.push({type:'question', q}));
  FLOW.push({type:'analyzing', label:'Calculando o seu Índice de Preparo para a Redação...', dur:5000});

/* =========================================================
   ÍNDICE DE PREPARO PARA A REDAÇÃO
   Calculado das respostas e comprimido numa faixa baixa (14 a 38):
   o teste sempre acusa que falta preparo (decisão do dono do funil).
   ========================================================= */
function calcRedacao(){
  const a = state.answers;
  const qtd  = pts(a.qtd,  QUESTIONS.find(q=>q.id==='qtd').options) / 3;
  const nota = pts(a.nota, QUESTIONS.find(q=>q.id==='nota').options) / 5;
  const tmp  = pts(a.tempo,QUESTIONS.find(q=>q.id==='tempo').options) / 3;
  const intr = pts(a.intro,QUESTIONS.find(q=>q.id==='intro').options) / 3;
  const rep  = pts(a.repertorio,QUESTIONS.find(q=>q.id==='repertorio').options) / 3;
  const con  = pts(a.conectivos,QUESTIONS.find(q=>q.id==='conectivos').options) / 3;
  const pro  = pts(a.proposta,QUESTIONS.find(q=>q.id==='proposta').options) / 3;
  const cor  = pts(a.correcao,QUESTIONS.find(q=>q.id==='correcao').options) / 3;
  const trava = a.trava || [];
  const travou = txt => trava.some(t=>t.startsWith(txt)) ? 0.5 : 1;   // a parte em que trava pesa contra
  const raw = qtd*15 + nota*20 + tmp*5 + intr*10 + rep*15 + con*10 + pro*15 + cor*10;   // 0..100
  const idx = Math.round(14 + raw*0.24);
  const barra = r => Math.min(46, Math.round(8 + r*38));
  const comps = [
    {n:'C1 · Norma culta',              v:barra((nota+qtd)/2)},
    {n:'C2 · Tema e repertório',        v:barra(((rep+intr)/2)*travou('Repertório')*travou('Introdução'))},
    {n:'C3 · Argumentação',             v:barra(((nota+tmp)/2)*travou('Desenvolvimento')*travou('Tese'))},
    {n:'C4 · Coesão e conectivos',      v:barra(con*travou('Conectivos'))},
    {n:'C5 · Proposta de intervenção',  v:barra(pro*travou('Conclusão'))}
  ];
  return { idx, comps };
}
function nivel(i){ return i<24 ? {txt:'MUITO BAIXO', cor:'#d64545'} : {txt:'BAIXO', cor:'#e0703a'}; }
