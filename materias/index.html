<script>
const M = window.MATERIAS, Q = window.QUESTOES, C = window.ENEM_CONFIG;
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_LONGO = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const ORDEM_SEMANA = [1,2,3,4,5,6,0];
const COR_MAT = { mat:'#e8f0ff', fis:'#fff4dc', qui:'#e9fbf2', bio:'#e6f8ec', his:'#fdeee6', geo:'#e5f5fb', fil:'#f1ecff', soc:'#fdeef7', lin:'#ffeef4', red:'#eef1f8' };

/* ===================== util ===================== */
function F(s){ return S(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function S(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function ls(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} if(window.Conta) Conta.agendar(); }
function hojeISO(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function diasEntre(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function diasEnem(){ if(!C.DATA_ENEM) return null; const d=Math.ceil((new Date(C.DATA_ENEM+'T09:00:00')-new Date())/86400000); return d>0?d:null; }
function fmtMin(m){ m=Math.round(m||0); return m>=60 ? Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'') : m+' min'; }
function mat(id){ return M.find(m=>m.id===id); }
function checkout(prod){ const url=C.CHECKOUT[prod]; if(!url){ toast('Link de compra ainda não configurado.'); return; } location.href=url; }
function saudacao(){ const h=new Date().getHours(); return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'; }
function primeiroNome(){ const p=perfil(); return ((p&&p.nome)||Conta.nome()||'').split(' ')[0]; }
function barraTopo(titulo, voltar){ return `<div class="barra-topo">${voltar?`<button class="voltar" onclick="history.back()" aria-label="Voltar">←</button>`:''}<h1>${titulo}</h1></div>`; }
function anel(pct, valor, rotulo, cls, cor){
  const r=42, c=2*Math.PI*r, p=Math.max(0,Math.min(100,pct||0));
  return `<div class="anel ${cls||''}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#eaf0fb" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${cor||'url(#gAzul)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}"/><defs><linearGradient id="gAzul" x1="0" x2="1"><stop offset="0" stop-color="#1d3f8f"/><stop offset="1" stop-color="#3b6fd8"/></linearGradient></defs></svg><div class="c"><b>${valor}</b>${rotulo?`<span>${rotulo}</span>`:''}</div></div>`;
}

/* ===================== dados do aluno ===================== */
const perfil    = ()=>ls('mat_perfil',null);
const lidos     = ()=>ls('mat_lidos',[]);
const lidosEm   = ()=>ls('mat_lidos_em',{});         // {temaId: 'YYYY-MM-DD'}
const revisoes  = ()=>ls('mat_revisoes',{});         // {temaId: 'YYYY-MM-DD' da última revisão}
const sessoes   = ()=>ls('mat_tempo',[]);            // [{d, m, min}]
const respostas = ()=>ls('mat_resp',{});             // {indiceQuestao: true|false}
const respDia   = ()=>ls('mat_resp_dia',{});         // {'YYYY-MM-DD': n}
const checkins  = ()=>ls('mat_checkin',{});          // {'YYYY-MM-DD': 'humor'}

function minutosPor(filtro){ const r={}; sessoes().filter(filtro||(()=>true)).forEach(s=>{ r[s.m]=(r[s.m]||0)+s.min; }); return r; }
function minutosDia(iso){ return sessoes().filter(s=>s.d===iso).reduce((a,s)=>a+s.min,0); }
function totalMin(){ return sessoes().reduce((a,s)=>a+s.min,0); }
function inicioSemana(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return hojeISO(d); }
function diasAtivos(){ return new Set(sessoes().map(s=>s.d).concat(ls('mat_dias_leitura',[]))); }
function sequencia(){ const set=diasAtivos(); let n=0; const d=new Date(); if(!set.has(hojeISO(d))) d.setDate(d.getDate()-1); while(set.has(hojeISO(d))){ n++; d.setDate(d.getDate()-1); } return n; }
function melhorSequencia(){ const ds=[...diasAtivos()].sort(); let best=0,cur=0,prev=null; ds.forEach(d=>{ cur = (prev && diasEntre(prev,d)===1) ? cur+1 : 1; best=Math.max(best,cur); prev=d; }); return best; }
function marcarDiaAtivo(){ const a=ls('mat_dias_leitura',[]); const h=hojeISO(); if(!a.includes(h)){ a.push(h); lsSet('mat_dias_leitura',a.slice(-200)); } }
function lidosHoje(){ const L=lidosEm(), h=hojeISO(); return Object.keys(L).filter(k=>L[k]===h).length; }
function acertosTotal(){ return Object.values(respostas()).filter(Boolean).length; }
const totalTemas = M.reduce((s,m)=>s+m.temas.length,0);

/* ===================== plano ===================== */
function gerarPlano(p){
  const dif = (p.dificeis||[]).filter(id=>mat(id));
  const outras = M.map(m=>m.id).filter(id=>!dif.includes(id));
  const fila = []; const metade = Math.ceil(outras.length/2);
  [outras.slice(0,metade), outras.slice(metade)].forEach(parte=>{
    const rodada=[...dif]; parte.forEach((o,i)=>rodada.splice(Math.min(rodada.length,i*2+1),0,o)); fila.push(...rodada);
  });
  if(fila.filter(x=>x==='red').length<2) fila.splice(3,0,'red');
  const diasEstudo = (p.dias||[1,2,3,4,5]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
  const blocos = p.minutos>=90 ? 2 : 1, minBloco = Math.round(p.minutos/blocos);
  const plano = {}; let k=0;
  diasEstudo.forEach(d=>{
    if(d===0 && diasEstudo.length>1){ plano[d]=[{m:'revisao',min:p.minutos}]; return; }
    plano[d]=[];
    for(let b=0;b<blocos;b++){ let m=fila[k%fila.length]; k++; if(plano[d].some(x=>x.m===m)){ m=fila[k%fila.length]; k++; } plano[d].push({m,min:minBloco}); }
  });
  return plano;
}
function nomeBloco(id){ return id==='revisao' ? 'Revisão da semana' : (mat(id)?mat(id).nome:id); }
function iconeBloco(id){ return id==='revisao' ? '🔁' : (mat(id)?mat(id).icone:'📘'); }
function proximosTemas(mid, n){ const m=mat(mid); if(!m) return []; const L=lidos(); return m.temas.filter(t=>!L.includes(t.id)).sort((a,b)=>(a.prio==='alta'?0:1)-(b.prio==='alta'?0:1)).slice(0,n||1); }
function blocoFeito(dIso, b){ const feito = sessoes().filter(s=>s.d===dIso && s.m===b.m).reduce((a,s)=>a+s.min,0); return feito >= Math.round(b.min*0.8); }
function blocosHoje(){ const p=perfil(); return (p.plano[new Date().getDay()]||[]); }
function metaMinHoje(){ return blocosHoje().reduce((a,b)=>a+b.min,0); }
/* minutos planejados do dia do cadastro até o ENEM */
function minutosPlanejados(){
  const p=perfil(); if(!C.DATA_ENEM) return 0;
  let tot=0; const d=new Date((p.criadoEm||hojeISO())+'T12:00:00'), fim=new Date(C.DATA_ENEM+'T12:00:00');
  while(d<fim){ tot += (p.plano[d.getDay()]||[]).reduce((a,b)=>a+b.min,0); d.setDate(d.getDate()+1); }
  return tot;
}
function fase(){
  const d=diasEnem();
  if(d===null) return {n:1,nome:'Base',txt:'Construa a base com os temas que mais caem.',ic:'🧱'};
  if(d>21) return {n:1,nome:'Base',txt:'Agora é hora de cobrir os temas que mais caem, um por dia.',ic:'🧱'};
  if(d>7)  return {n:2,nome:'Prática',txt:'Junte leitura com exercícios e redação toda semana.',ic:'🎯'};
  return {n:3,nome:'Revisão final',txt:'Revise o que já leu e descanse bem. Nada de conteúdo novo pesado.',ic:'🏁'};
}

/* ===================== meta de temas da semana ===================== */
function temasPorBloco(b){ return Math.max(1, Math.min(3, Math.round(b.min/25))); }
function metaSemana(){
  const p=perfil(), d=diasEnem();
  const capacidade = Object.values(p.plano).flat().filter(b=>b.m!=='revisao').reduce((a,b)=>a+temasPorBloco(b),0);
  const restantes = totalTemas - lidos().length;
  const semanas = d ? Math.max(1, Math.ceil(d/7)) : 4;
  const meta = Math.max(1, Math.min(capacidade, Math.ceil(restantes/semanas)));
  const ini = inicioSemana(), L = lidosEm();
  const feitos = Object.keys(L).filter(k=>L[k]>=ini).length;
  const cobertos = Math.min(totalTemas, lidos().length + capacidade*semanas);
  return { meta, feitos, capacidade, semanas, cobertos };
}

/* ===================== revisão espaçada ===================== */
const INTERVALOS = [1,3,7,14];
function revisoesPendentes(){
  const L=lidosEm(), R=revisoes(), h=hojeISO();
  return Object.keys(L).filter(id=>{
    const dias=diasEntre(L[id],h);
    if(!INTERVALOS.includes(dias)) return false;
    return R[id]!==h;
  }).map(id=>{ let t,m; M.forEach(mm=>mm.temas.forEach(tt=>{ if(tt.id===id){t=tt;m=mm;} })); return t?{t,m,dias:diasEntre(L[id],h)}:null; }).filter(Boolean);
}

/* ===================== níveis e conquistas ===================== */
const NIVEIS = [[0,'Iniciante'],[150,'Focado'],[400,'Constante'],[800,'Determinado'],[1500,'Imparável'],[2500,'Mestre do ENEM']];
function xp(){ return Math.round(totalMin() + lidos().length*25 + acertosTotal()*10 + Object.keys(respostas()).length*3 + Object.keys(revisoes()).length*10); }
function nivel(){
  const x=xp(); let i=0; NIVEIS.forEach((n,j)=>{ if(x>=n[0]) i=j; });
  const prox = NIVEIS[i+1];
  return { n:i+1, nome:NIVEIS[i][1], xp:x, prox: prox?prox[1]:null, falta: prox?prox[0]-x:0, pct: prox ? Math.round((x-NIVEIS[i][0])/(prox[0]-NIVEIS[i][0])*100) : 100 };
}
const MEDALHAS = [
  {e:'🚀', n:'Primeiro passo', d:'1ª sessão de estudo', ok:()=>sessoes().length>=1},
  {e:'🔥', n:'Pegando ritmo', d:'3 dias seguidos', ok:()=>melhorSequencia()>=3},
  {e:'⚡', n:'Semana perfeita', d:'7 dias seguidos', ok:()=>melhorSequencia()>=7},
  {e:'📖', n:'Leitor', d:'10 temas lidos', ok:()=>lidos().length>=10},
  {e:'📚', n:'Devorador', d:'30 temas lidos', ok:()=>lidos().length>=30},
  {e:'⏱️', n:'5 horas', d:'5h de estudo', ok:()=>totalMin()>=300},
  {e:'🏋️', n:'20 horas', d:'20h de estudo', ok:()=>totalMin()>=1200},
  {e:'🧠', n:'Memória afiada', d:'5 revisões feitas', ok:()=>Object.keys(revisoes()).length>=5},
  {e:'🎯', n:'Na mira', d:'20 questões certas', ok:()=>acertosTotal()>=20},
  {e:'🏆', n:'Matéria fechada', d:'Todos os temas de uma matéria', ok:()=>M.some(m=>m.temas.every(t=>lidos().includes(t.id)))},
  {e:'🌅', n:'Madrugador', d:'Estudar antes das 8h', ok:()=>ls('mat_madrugou',false)},
  {e:'🌙', n:'Coruja', d:'Estudar depois das 22h', ok:()=>ls('mat_coruja',false)}
];

/* ===================== check-in de humor ===================== */
const HUMORES = [
  {id:'cansado', e:'😫', l:'Cansado', dica:'Dia pesado? Faça só o primeiro bloco do plano hoje. Constância vale mais que maratona.'},
  {id:'ansioso', e:'😰', l:'Ansioso', dica:'Antes de começar, respire fundo 4 vezes: 4 segundos inspirando e 6 soltando. Depois, um tema de cada vez.'},
  {id:'normal',  e:'🙂', l:'Normal',  dica:'Bom dia para seguir o plano do jeito que ele está. Comece pelo bloco mais difícil.'},
  {id:'focado',  e:'💪', l:'Focado',  dica:'Aproveite a energia: depois do plano, adiante uma revisão ou faça questões extras.'}
];

/* ===================== notificações ===================== */
function notificacoes(){
  const L=[], h=hojeISO(), p=perfil(), d=diasEnem();
  const bl=blocosHoje(), pend=bl.filter(b=>!blocoFeito(h,b));
  if(pend.length) L.push({id:'plano'+h, ic:'📅', t:`${pend.length} ${pend.length>1?'blocos':'bloco'} de estudo para hoje`, s:pend.map(b=>nomeBloco(b.m)).join(' e '), r:'plano'});
  const rv=revisoesPendentes(); if(rv.length) L.push({id:'rev'+h, ic:'🧠', t:`${rv.length} ${rv.length>1?'revisões':'revisão'} para hoje`, s:'Revisar no tempo certo ajuda a guardar o conteúdo.', r:'inicio'});
  const sq=sequencia(); if(sq>=2) L.push({id:'seq'+h, ic:'🔥', t:`${sq} dias seguidos!`, s: sq>=melhorSequencia()?'É o seu recorde. Não deixe a sequência cair hoje.':'Continue: falta pouco para o seu recorde.', r:'progresso'});
  if(d) L.push({id:'enem'+h, ic:'⏳', t:`Faltam ${d} dias para o ENEM`, s:`Fase ${fase().n}: ${fase().nome}. ${fase().txt}`, r:'plano'});
  if(!('Notification' in window) || Notification.permission!=='granted') L.push({id:'lemb', ic:'⏰', t:'Ative os lembretes', s:`Receba um aviso às ${p.hora} nos seus dias de estudo.`, r:'lembretes'});
  const lid = ls('mat_notif_lidas',[]);
  return L.map(n=>Object.assign(n,{nova:!lid.includes(n.id)}));
}

/* ===================== LOGIN ===================== */
let modoLogin = 'criar';
function telaLogin(msg, erro){
  nav.style.display='none';
  const v = id=>{ const e=document.getElementById(id); return e?e.value:''; };
  const keep = {nome:v('lNome'), email:v('lEmail')};
  app.innerHTML = `<div class="login">
    <div class="login-hero">
      <div class="logo"><i>✓</i>Plano ENEM</div>
      <h1>${modoLogin==='recuperar'?'Vamos recuperar o seu acesso':'O seu plano de estudos até o ENEM'}</h1>
      <p>${modoLogin==='recuperar'?'Enviaremos um link para você criar uma senha nova.':'Crie a sua conta para salvar o seu progresso e acessar de qualquer aparelho.'}</p>
    </div>
    <div class="login-box">
      ${modoLogin!=='recuperar'?`<div class="abas"><button class="${modoLogin==='criar'?'on':''}" onclick="modoLogin='criar';telaLogin()">Criar conta</button><button class="${modoLogin==='entrar'?'on':''}" onclick="modoLogin='entrar';telaLogin()">Entrar</button></div>`:''}
      ${modoLogin==='criar'?`<div class="campo"><label for="lNome">Seu primeiro nome</label><input class="inp" id="lNome" autocomplete="given-name" maxlength="30" placeholder="Como quer ser chamado(a)"></div>`:''}
      <div class="campo"><label for="lEmail">E-mail</label><input class="inp" id="lEmail" type="email" inputmode="email" autocomplete="email" placeholder="o mesmo da compra"></div>
      ${modoLogin!=='recuperar'?`<div class="campo"><label for="lSenha">Senha</label><input class="inp" id="lSenha" type="password" autocomplete="${modoLogin==='criar'?'new-password':'current-password'}" placeholder="${modoLogin==='criar'?'Mínimo de 6 caracteres':'Sua senha'}"></div>`:''}
      ${msg?`<p class="${erro?'erro-msg':'ok-msg'}">${S(msg)}</p>`:''}
      <button class="btn" id="lOk">${modoLogin==='criar'?'Criar minha conta':modoLogin==='entrar'?'Entrar':'Enviar link'}</button>
      <p style="text-align:center;margin-top:16px;">${modoLogin==='entrar'?'<a href="#" class="link" onclick="modoLogin=\'recuperar\';telaLogin();return false;">Esqueci a minha senha</a>':modoLogin==='recuperar'?'<a href="#" class="link" onclick="modoLogin=\'entrar\';telaLogin();return false;">Voltar para entrar</a>':''}</p>
      <div class="selos"><span>🔒 Dados protegidos</span><span>📱 Funciona no celular</span><span>☁️ Progresso salvo</span></div>
    </div></div>`;
  if(keep.nome && document.getElementById('lNome')) document.getElementById('lNome').value=keep.nome;
  if(keep.email) document.getElementById('lEmail').value=keep.email;
  const ok=document.getElementById('lOk');
  async function enviar(){
    ok.disabled=true; ok.textContent='Aguarde...';
    try{
      if(modoLogin==='recuperar'){ await Conta.recuperarSenha(v('lEmail')); modoLogin='entrar'; telaLogin('Se o e-mail tiver conta, o link chega em instantes. Confira o spam.'); return; }
      const lib = modoLogin==='criar' ? await Conta.criar(v('lNome'), v('lEmail'), v('lSenha')) : await Conta.entrar(v('lEmail'), v('lSenha'));
      if(lib.length) setTimeout(()=>toast('Acesso liberado! 🎉'),300);
      render();
    }catch(e){ telaLogin(e.message, true); }
  }
  ok.onclick=enviar;
  app.querySelectorAll('.inp').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') enviar(); }));
}

/* ===================== CÓDIGO (sem login, ou para liberar bumps) ===================== */
function telaCodigo(){
  nav.style.display = perfil() ? '' : 'none';
  app.innerHTML = `${barraTopo('Liberar um produto', !!perfil())}
  <div class="tela fade">
    <div class="card hero"><div class="k">Código de acesso</div><div class="grande" style="font-size:22px;">Comprou um produto extra?</div><p>Abra o link que chegou no seu e-mail de compra ou digite o código aqui.</p></div>
    <div class="card">
      <div class="campo"><label for="cod">Código</label><input class="inp" id="cod" placeholder="Ex.: EXE-XXXXXX-XXXX" autocomplete="off" style="text-transform:uppercase;"></div>
      <button class="btn" id="okCod">Liberar</button>
      ${C.SUPORTE_EMAIL?`<p class="nota" style="text-align:center;margin-top:12px;">Problemas? ${S(C.SUPORTE_EMAIL)}</p>`:''}
    </div>
  </div>`;
  const f=document.getElementById('cod');
  async function ok(){
    const p = await Acesso.resgatar(f.value);
    if(!p){ toast('Código não encontrado. Confira e tente de novo.'); return; }
    if(p==='arsenal'||p==='correcao'){ toast('Esse código é do app de redação. Abrindo...'); setTimeout(()=>location.href='/redacao',900); return; }
    toast('Liberado! 🎉'); irPara(p==='exercicios'?'exercicios':'inicio');
  }
  document.getElementById('okCod').onclick=ok;
  f.addEventListener('keydown',e=>{ if(e.key==='Enter') ok(); });
}

/* ===================== ONBOARDING ===================== */
const CURSOS = [['🩺','Medicina'],['⚖️','Direito'],['🛠️','Engenharias'],['🧠','Psicologia'],['💉','Enfermagem e saúde'],['📈','Administração ou Economia'],['🍎','Pedagogia e licenciaturas'],['✨','Outro curso']];
const METAS = [['🚀','Acima de 800'],['🎯','De 700 a 800'],['📈','De 600 a 700'],['✅','Até 600'],['🤔','Ainda não sei']];
const MOMENTOS = [['🌱','Estou começando agora'],['📘','Já estudei uma parte'],['💪','Estudei bastante, quero revisar']];
const PERIODOS = [['🌅','Manhã','08:00'],['☀️','Tarde','14:00'],['🌙','Noite','19:00']];
let ob = null;
function iniciarOnboarding(editar){
  const p = perfil()||{}, q = ls('enem_quiz2',{});
  const difQuiz = (q.materias||[]).map(n=>(M.find(m=>m.nome===n||n.startsWith(m.nome))||{}).id).filter(Boolean);
  const metaQuiz = {'Acima de 800':'Acima de 800','De 700 a 800':'De 700 a 800','De 600 a 700':'De 600 a 700','Até 600 pontos':'Até 600'}[q.meta];
  const cursoQuiz = q.curso==='Enfermagem e outras da saúde'?'Enfermagem e saúde':q.curso;
  ob = { passo:0, editar:!!editar, d:{
    nome: p.nome || q.nome || Conta.nome() || '',
    curso: p.curso || (CURSOS.some(c=>c[1]===cursoQuiz)?cursoQuiz:''),
    meta: p.meta || metaQuiz || '',
    momento: p.momento || '',
    dificeis: p.dificeis || difQuiz,
    minutos: p.minutos || ({'Menos de 1 hora':45,'De 1 a 2 horas':90,'De 2 a 4 horas':120,'Mais de 4 horas':150}[q.horas]) || 0,
    dias: p.dias || [1,2,3,4,5],
    periodo: p.periodo || '',
    hora: p.hora || '19:00'
  }};
  telaOnboarding();
}
const PASSOS = ['nome','curso','meta','momento','dificeis','minutos','dias','periodo'];
function telaOnboarding(){
  nav.style.display='none';
  const d = ob.d, passo = PASSOS[ob.passo], n = PASSOS.length;
  let titulo='', sub='', corpo='', pode=true;
  const esc = (lista, campo, val)=>`<div class="esc">${lista.map(o=>`<button class="${d[campo]===o[1]?'on':''}" onclick="ob.d.${campo}='${o[1]}';${val?`ob.d.hora='${o[2]}';`:''}telaOnboarding()"><span class="e">${o[0]}</span>${S(o[1])}<span class="r">${d[campo]===o[1]?'✓':''}</span></button>`).join('')}</div>`;
  if(passo==='nome'){ titulo='Como você quer ser chamado(a)?'; sub='É assim que o app vai falar com você.'; corpo=`<input class="inp" id="obNome" value="${S(d.nome)}" placeholder="Seu primeiro nome" maxlength="30" autocomplete="given-name">`; }
  if(passo==='curso'){ titulo='Qual curso você quer fazer?'; sub='Vamos lembrar você do seu objetivo todos os dias.'; corpo=esc(CURSOS,'curso'); pode=!!d.curso; }
  if(passo==='meta'){ titulo='Qual nota você quer tirar?'; sub='A sua meta define o ritmo do plano.'; corpo=esc(METAS,'meta'); pode=!!d.meta; }
  if(passo==='momento'){ titulo='Como você está em relação à prova?'; sub='Assim o plano equilibra conteúdo novo e revisão.'; corpo=esc(MOMENTOS,'momento'); pode=!!d.momento; }
  if(passo==='dificeis'){ titulo='Em quais matérias você tem mais dificuldade?'; sub='Escolha até 4. Elas vão aparecer com mais frequência no seu plano.';
    corpo=`<div class="chips">${M.map(m=>`<button class="${d.dificeis.includes(m.id)?'on':''}" onclick="togDif('${m.id}')">${m.icone} ${S(m.nome)}</button>`).join('')}</div>`; }
  if(passo==='minutos'){ titulo='Quanto tempo por dia você consegue estudar?'; sub='Seja realista: é melhor cumprir 45 minutos do que abandonar 3 horas.';
    corpo=`<div class="esc">${[[30,'⚡','Rápido e constante'],[45,'🙂','Leve'],[60,'📘','Equilibrado'],[90,'💪','Puxado'],[120,'🔥','Intenso'],[150,'🚀','Reta final total']].map(o=>`<button class="${d.minutos===o[0]?'on':''}" onclick="ob.d.minutos=${o[0]};telaOnboarding()"><span class="e">${o[1]}</span><div><b style="display:block;">${fmtMin(o[0])} por dia</b><span style="font-size:12.5px;color:var(--cinza);font-weight:500;">${o[2]}</span></div><span class="r">${d.minutos===o[0]?'✓':''}</span></button>`).join('')}</div>`; pode=!!d.minutos; }
  if(passo==='dias'){ titulo='Em quais dias da semana?'; sub='Os outros dias ficam livres para descansar.';
    corpo=`<div class="chips">${ORDEM_SEMANA.map(x=>`<button class="${d.dias.includes(x)?'on':''}" onclick="togDia(${x})">${DIAS_LONGO[x]}</button>`).join('')}</div>`; pode=d.dias.length>0; }
  if(passo==='periodo'){ titulo='Qual é o melhor horário para você?'; sub='É quando o lembrete vai chegar.';
    corpo=esc(PERIODOS,'periodo',true)+`<div class="campo" style="margin-top:16px;"><label for="obHora">Horário exato</label><input class="inp" id="obHora" type="time" value="${S(d.hora)}"></div>`; pode=!!d.periodo; }
  app.innerHTML = `<div class="ob">
    <div class="ob-top">${ob.passo>0||ob.editar?`<button class="voltar" onclick="voltarOb()" aria-label="Voltar">←</button>`:''}<div class="ob-prog"><i style="width:${(ob.passo+1)/n*100}%"></i></div><span class="ob-passo">${ob.passo+1}/${n}</span></div>
    <div class="corpo fade"><h2>${titulo}</h2><p class="sub">${sub}</p>${corpo}</div>
    <button class="btn" id="obOk" ${pode?'':'disabled'} style="margin-top:20px;">${ob.passo===n-1?'Montar meu plano':'Continuar'}</button>
  </div>`;
  const nm=document.getElementById('obNome'); if(nm){ nm.focus(); nm.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('obOk').click(); }); }
  document.getElementById('obOk').onclick=()=>{
    if(passo==='nome'){ ob.d.nome = (nm.value.trim()||'Estudante'); }
    if(passo==='periodo'){ ob.d.hora = document.getElementById('obHora').value || ob.d.hora; }
    if(ob.passo<n-1){ ob.passo++; telaOnboarding(); window.scrollTo(0,0); } else telaGerando();
  };
}
function voltarOb(){ if(ob.passo===0){ ob=null; irPara('perfil'); render(); return; } ob.passo--; telaOnboarding(); }
function togDif(id){ const a=ob.d.dificeis; ob.d.dificeis = a.includes(id) ? a.filter(x=>x!==id) : (a.length>=4 ? [...a.slice(1),id] : [...a,id]); telaOnboarding(); }
function togDia(x){ const a=ob.d.dias; ob.d.dias = a.includes(x) ? a.filter(y=>y!==x) : [...a,x]; telaOnboarding(); }
function telaGerando(){
  const etapas = ['Analisando as suas matérias','Distribuindo o tempo na semana','Priorizando os temas que mais caem','Encaixando revisões e redação'];
  app.innerHTML = `<div class="ob"><div class="gerando">${anel(0,'0%','montando','', '')}<h2 style="margin-top:22px;">Montando o seu plano, ${S(ob.d.nome.split(' ')[0])}...</h2><div class="passos-ger">${etapas.map((e,i)=>`<div id="pg${i}"><i></i>${e}</div>`).join('')}</div></div></div>`;
  const t0=performance.now(), DUR=3200;
  (function tick(now){
    const t=Math.min(1,(now-t0)/DUR), e=t*t*(3-2*t), pct=Math.round(e*100);
    const a=app.querySelector('.anel'); if(!a) return;
    a.outerHTML; a.querySelectorAll('circle')[1].setAttribute('stroke-dashoffset', 2*Math.PI*42*(1-pct/100)); a.querySelector('b').textContent=pct+'%';
    etapas.forEach((_,i)=>{ if(pct>=(i+1)*24){ const el=document.getElementById('pg'+i); if(el && !el.classList.contains('ok')){ el.classList.add('ok'); el.querySelector('i').textContent='✓'; } } });
    if(t<1) requestAnimationFrame(tick); else setTimeout(salvarPerfil, 350);
  })(performance.now());
}
function salvarPerfil(){
  const ant = perfil();
  const np = Object.assign({}, ob.d, { dificeis: ob.d.dificeis.slice(0,4), criadoEm: (ant&&ant.criadoEm)||hojeISO() });
  np.plano = gerarPlano(np);
  lsSet('mat_perfil', np);
  const editar = ob.editar; ob=null;
  telaPlanoPronto(editar);
}

      <div class="linha"><span class="e">✍️</span><div><b>${red} ${red>1?'blocos':'bloco'} de redação por semana</b><span>Para treinar e corrigir com frequência</span></div></div>
      <div class="linha"><span class="e">⏰</span><div><b>Lembrete às ${S(p.hora)}</b><span>${p.dias.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(x=>DIAS[x]).join(', ')}</span></div></div>
      ${d?`<div class="linha"><span class="e">⏳</span><div><b>${d} dias até o ENEM</b><span>Cerca de ${fmtMin(minutosPlanejados())} de estudo planejado até a prova</span></div></div>`:''}
    </div></div>
    <button class="btn" onclick="irPara('inicio');render();">Começar agora</button></div>`;

let timerInt=null;

  const st=ls('mat_timer',null);

function baixarICS(){
  const p=perfil(); const [hh,mm]=(p.hora||'19:00').split(':');
  const by=p.dias.map(d=>['SU','MO','TU','WE','TH','FR','SA'][d]).join(',');
  const d=new Date(); const ini=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+hh+mm+'00';
  const ate=C.DATA_ENEM?';UNTIL='+C.DATA_ENEM.replace(/-/g,'')+'T235959':'';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PlanoENEM//PT-BR','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:plano-enem-'+Date.now()+'@testegratuitoenem','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART:'+ini,'DURATION:PT'+p.minutos+'M','RRULE:FREQ=WEEKLY;BYDAY='+by+ate,'SUMMARY:📚 Hora de estudar para o ENEM','DESCRIPTION:Abra o seu plano: '+location.origin+'/materias','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Hora de estudar para o ENEM','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download='lembrete-estudo-enem.ics'; document.body.appendChild(a); a.click(); a.remove();
  toast('Abra o arquivo baixado para salvar no calendário.');
}
function checaLembrete(){

  const ag=new Date(), hm=String(ag.getHours()).padStart(2,'0')+':'+String(ag.getMinutes()).padStart(2,'0');
  if(!p.dias.includes(ag.getDay())||hm!==p.hora) return;
  const ch=hojeISO()+p.hora; if(ls('mat_ult_lembrete','')===ch) return; lsSet('mat_ult_lembrete',ch);
  const corpo=(p.plano[ag.getDay()]||[]).map(b=>nomeBloco(b.m)).join(' + ')||'Abra o seu plano de estudos.';
  if(navigator.serviceWorker&&navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r=>r.showNotification('📚 Hora de estudar, '+primeiroNome()+'!',{body:'Hoje: '+corpo,icon:'/shared/icone.svg'})).catch(()=>{});

    <div class="card hero"><div class="k">Mini simulado</div><div class="grande" style="font-size:22px;">10 questões, cronometrado</div><p>Todas as matérias. O resultado entra no seu progresso.</p><div style="height:12px"></div><button class="btn sec" style="background:#fff;" onclick="iniciarQ('simulado')">Começar simulado</button></div>
    <div class="secao">Treinar por matéria</div>
    ${ordem.map(m=>{ const qs=Q.map((q,i)=>({q,i})).filter(x=>x.q.m===m.id); if(!qs.length) return ''; const f=qs.filter(x=>x.i in R).length; return `<button class="tema-item" onclick="iniciarQ('treino','${m.id}')"><span class="ck" style="background:${COR_MAT[m.id]};border:none;font-size:15px;">${m.icone}</span><div style="flex:1;"><b>${S(m.nome)}</b><span class="nota">${f}/${qs.length} feitas${p&&p.dificeis.includes(m.id)?' · sua prioridade':''}</span></div><span class="seta">›</span></button>`; }).join('')}
    <button class="btn sec" onclick="irPara('erros')">📒 Caderno de erros</button>
    <p class="legal">Questões originais, elaboradas no estilo do ENEM para treino. Não são questões oficiais.</p>
  </div>`;
}
function embaralhar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function iniciarQ(modo, filtro, tema){
  let idx=Q.map((q,i)=>i);
  if(modo==='erros'){ const R=respostas(); idx=idx.filter(i=>R[i]===false); modo='treino'; }
  else if(tema) idx=idx.filter(i=>Q[i].t===tema); else if(filtro) idx=idx.filter(i=>Q[i].m===filtro);
  idx=embaralhar(idx); if(modo==='simulado') idx=idx.slice(0,10);
  if(!idx.length){ toast('Nenhuma questão aqui ainda.'); return; }
  sQ={lista:idx,i:0,acertos:0,modo,inicio:Date.now(),marcadas:{}}; irPara('questao');
}
function telaQuestao(){
  if(!sQ){ irPara('exercicios'); return; }
  const s=sQ; if(s.i>=s.lista.length) return telaFimQ();
  const qi=s.lista[s.i], q=Q[qi], mk=s.marcadas[qi], mostra=mk!==undefined&&s.modo==='treino';
  app.innerHTML = `${barraTopo((s.modo==='simulado'?'Simulado':'Treino')+' · '+(s.i+1)+'/'+s.lista.length,true)}
  <div class="tela fade"><div class="card">
    <div class="barra fina" style="margin:0 0 12px;"><i style="width:${s.i/s.lista.length*100}%"></i></div>
    <span class="tag azul">${mat(q.m).icone} ${S(mat(q.m).nome)}</span>
    <p class="q-enun">${S(q.e)}</p>
    ${q.a.map((a,j)=>`<button class="alt${mostra&&j===q.c?' ok':''}${mostra&&j===mk&&j!==q.c?' no':''}" ${mk!==undefined?'disabled':''} onclick="responder(${j})"><b>${'ABCDE'[j]}</b><span>${S(a)}</span></button>`).join('')}
    ${mostra?`<div class="explic"><b>${mk===q.c?'✅ Você acertou! +10 XP':'❌ Resposta correta: '+'ABCDE'[q.c]}</b><br>${S(q.x)}</div>`:''}
  </div>${mk!==undefined?`<button class="btn" onclick="sQ.i++;telaQuestao();window.scrollTo(0,0);">${s.i+1<s.lista.length?'Próxima →':'Ver resultado'}</button>`:''}</div>`;
}
function responder(j){
  const s=sQ, qi=s.lista[s.i], q=Q[qi]; s.marcadas[qi]=j; const ok=j===q.c; if(ok) s.acertos++;
  const R=respostas(); R[qi]=ok; lsSet('mat_resp',R);
  const rd=respDia(); rd[hojeISO()]=(rd[hojeISO()]||0)+1; lsSet('mat_resp_dia',rd); marcarDiaAtivo();
  if(s.modo==='simulado') s.i++;
  telaQuestao();
}
function telaFimQ(){
  const s=sQ, min=Math.max(1,Math.round((Date.now()-s.inicio)/60000));
  if(s.modo==='simulado'){ const reg=sessoes(); reg.push({d:hojeISO(),m:'revisao',min}); lsSet('mat_tempo',reg); }
  const pct=Math.round(s.acertos/s.lista.length*100);
  app.innerHTML = `${barraTopo('Resultado',false)}
  <div class="tela fade">
    <div class="card" style="text-align:center;">${anel(pct, s.acertos+'/'+s.lista.length, 'acertos', '')}<p class="nota" style="margin-top:8px;">${pct>=70?'Mandou bem! 🎉':pct>=40?'Bom caminho. Revise os erros.':'Normal no começo. Os erros mostram o que estudar.'} · ${fmtMin(min)}</p></div>
    ${s.modo==='simulado'?`<div class="secao">Gabarito</div>${s.lista.map((qi,k)=>{ const q=Q[qi], m=s.marcadas[qi]; return `<details class="acc"><summary>${m===q.c?'✅':'❌'} ${k+1}. ${S(mat(q.m).nome)}</summary><div class="ct"><p class="q-enun">${S(q.e)}</p><p><b>Sua:</b> ${'ABCDE'[m]} · <b>Correta:</b> ${'ABCDE'[q.c]}</p><div class="explic">${S(q.x)}</div></div></details>`; }).join('')}`:''}
    <button class="btn" onclick="sQ=null;irPara('exercicios')">Voltar aos exercícios</button>
    <button class="btn sec" onclick="sQ=null;irPara('progresso')">Ver meu progresso</button>
  </div>`;
}

/* ===================== roteador ===================== */
function irPara(r){ if(location.hash==='#'+r) render(); else location.hash=r; }
function sairConta(){ Conta.sair().then(()=>{ diaSel=null; location.hash=''; render(); }); }
function render(){
  clearInterval(timerInt);
  if(Conta.ativo && Conta.recuperando){ nav.style.display='none'; Conta.telaNovaSenha(app,'Plano ENEM',()=>{ Conta.recuperando=false; toast('Senha salva!'); render(); }); return; }
  if(Conta.ativo && !Conta.usuario()){ telaLogin(); return; }
  const r=(location.hash||'#inicio').slice(1), pt=r.split('/');
  const temPlano=Acesso.tem('plano'), temEx=Acesso.tem('exercicios');
  if(pt[0]==='codigo' || (!temPlano && !temEx)){ telaCodigo(); return; }
  if(!temPlano){ nav.style.display='none'; if(pt[0]==='questao') return telaQuestao(); if(pt[0]==='erros') return telaErros(); if(pt[0]==='treino') return iniciarQ('treino',null,pt[2]); return telaExercicios(); }
  if(!perfil()){ if(!ob) iniciarOnboarding(false); else telaOnboarding(); return; }
  nav.style.display='';
  const aba = {inicio:'inicio',notificacoes:'inicio',timer:'plano',plano:'plano',resumos:'resumos',materia:'resumos',tema:'resumos',progresso:'progresso',erros:'progresso'}[pt[0]] || 'perfil';
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.r===aba));
  const T = { plano:telaPlano, resumos:telaResumos, progresso:telaProgresso, perfil:telaPerfil, notificacoes:telaNotificacoes, lembretes:telaLembretes, materiais:telaMateriais, exercicios:telaExercicios, questao:telaQuestao, erros:telaErros };
  if(pt[0]==='materia') telaMateria(pt[1]);
  else if(pt[0]==='tema') telaTema(pt[1]);
  else if(pt[0]==='timer') telaTimer(pt[1], +pt[2]||30);
  else if(pt[0]==='treino'){ if(!temEx) telaExercicios(); else iniciarQ('treino',null,pt[2]); return; }
  else (T[pt[0]]||telaInicio)();
  window.scrollTo(0,0);
}
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(b.dataset.r==='plano') diaSel=null; irPara(b.dataset.r); });
window.addEventListener('hashchange', render);
(async()=>{
  let lib=[];
  try{ lib=await Conta.iniciar(); }catch(e){ console.error(e); toast(e.message); }
  lib=lib.concat(await Acesso.lerDaUrl());
  if(lib.length) setTimeout(()=>toast('Acesso liberado! 🎉'),300);
  render();
})();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
</script>
</body>
