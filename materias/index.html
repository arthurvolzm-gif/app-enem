function melhorSequencia(){ const ds=[...diasAtivos()].sort(); let best=0,cur=0,prev=null; ds.forEach(d=>{ cur = (prev && diasEntre(prev,d)===1) ? cur+1 : 1; best=Math.max(best,cur); prev=d; }); return best; }

/* ===================== plano ===================== */
/* plano semanal: todas as matérias entram na semana. Quando há mais matérias do que dias,
   o dia leva 2 (ou 3) matérias e o tempo é dividido entre elas. As prioritárias vêm primeiro e se repetem mais. */
function gerarPlano(p){
  const dif = (p.dificeis||[]).filter(id=>mat(id));
  const fila = [...dif, ...M.map(m=>m.id).filter(id=>!dif.includes(id))];
  const diasEstudo = (p.dias||[1,2,3,4,5]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
  const comRev = diasEstudo.includes(0) && diasEstudo.length>1;
  const diasMat = comRev ? diasEstudo.filter(d=>d!==0) : diasEstudo;
  const porDia = Math.max(1, Math.min(3, Math.ceil(fila.length/Math.max(1,diasMat.length))));
  const base = Math.floor(p.minutos/porDia/5)*5; let sobra = p.minutos - base*porDia;
  const mins = [...Array(porDia)].map(()=>{ const x = base + (sobra>=5?5:0); if(sobra>=5) sobra-=5; return x; });
  const plano = {}; let k=0;
  diasEstudo.forEach(d=>{
    if(comRev && d===0){ plano[d]=[{m:'revisao',min:p.minutos}]; return; }
    plano[d]=[];
    for(let i=0;i<porDia;i++){ plano[d].push({m:fila[k%fila.length],min:mins[i]}); k++; }
  });
  return plano;
}
function nomeBloco(id){ return id==='revisao' ? 'Revisão da semana' : (mat(id)?mat(id).nome:id); }

/* minutos planejados do dia do cadastro até o ENEM */
function minutosPlanejados(){
  const p=perfil(); if(!C.DATA_ENEM) return 0;
  let tot=0; const d=new Date((p.criadoEm||hojeISO())+'T12:00:00'), fim=new Date(C.DATA_ENEM+'T12:00:00');
  while(d<fim){ tot += (p.plano[d.getDay()]||[]).reduce((a,b)=>a+b.min,0); d.setDate(d.getDate()+1); }
  return tot;
}
function fase(){
  const d=diasEnem();
  if(d===null) return {n:1,nome:'Base',txt:'Construa a base com os temas que mais caem.',ic:'🧱'};
  if(d>21) return {n:1,nome:'Base',txt:'Agora é hora de cobrir os temas que mais caem, um por dia.',ic:'🧱'};
  if(d>7)  return {n:2,nome:'Prática',txt:'Junte leitura com exercícios e redação toda semana.',ic:'🎯'};
  return {n:3,nome:'Revisão final',txt:'Revise o que já leu e descanse bem. Nada de conteúdo novo pesado.',ic:'🏁'};
}

/* ===================== meta de temas da semana ===================== */
function temasPorBloco(b){ return Math.max(1, Math.min(3, Math.round(b.min/25))); }
function metaSemana(){
  const p=perfil(), d=diasEnem();
  const capacidade = Object.values(p.plano).flat().filter(b=>b.m!=='revisao').reduce((a,b)=>a+temasPorBloco(b),0);
  const restantes = totalTemas - lidos().length;
  const semanas = d ? Math.max(1, Math.ceil(d/7)) : 4;
  const meta = Math.max(1, Math.min(capacidade, Math.ceil(restantes/semanas)));
  const ini = inicioSemana(), L = lidosEm();
  const feitos = Object.keys(L).filter(k=>L[k]>=ini).length;
  const cobertos = Math.min(totalTemas, lidos().length + capacidade*semanas);
  return { meta, feitos, capacidade, semanas, cobertos };
}

/* ===================== revisão espaçada ===================== */
const INTERVALOS = [1,3,7,14];
function revisoesPendentes(){
  const L=lidosEm(), R=revisoes(), h=hojeISO();
  return Object.keys(L).filter(id=>{
    const dias=diasEntre(L[id],h);
    if(!INTERVALOS.includes(dias)) return false;
    return R[id]!==h;
  }).map(id=>{ let t,m; M.forEach(mm=>mm.temas.forEach(tt=>{ if(tt.id===id){t=tt;m=mm;} })); return t?{t,m,dias:diasEntre(L[id],h)}:null; }).filter(Boolean);
}

/* ===================== notificações ===================== */
function notificacoes(){
  const L=[], h=hojeISO(), p=perfil(), d=diasEnem();
  const bl=blocosHoje(), pend=bl.filter(b=>!blocoFeito(h,b));
  if(pend.length) L.push({id:'plano'+h, ic:'📅', t:`${pend.length} ${pend.length>1?'blocos':'bloco'} de estudo para hoje`, s:pend.map(b=>nomeBloco(b.m)).join(' e '), r:'plano'});
  const rv=revisoesPendentes(); if(rv.length) L.push({id:'rev'+h, ic:'🧠', t:`${rv.length} ${rv.length>1?'revisões':'revisão'} para hoje`, s:'Revisar no tempo certo ajuda a guardar o conteúdo.', r:'inicio'});
  const sq=sequencia(); if(sq>=2) L.push({id:'seq'+h, ic:'🔥', t:`${sq} dias seguidos!`, s: sq>=melhorSequencia()?'É o seu recorde. Não deixe a sequência cair hoje.':'Continue: falta pouco para o seu recorde.', r:'progresso'});
  if(d) L.push({id:'enem'+h, ic:'⏳', t:`Faltam ${d} dias para o ENEM`, s:`Fase ${fase().n}: ${fase().nome}. ${fase().txt}`, r:'plano'});
  if(!('Notification' in window) || Notification.permission!=='granted') L.push({id:'lemb', ic:'⏰', t:'Ative os lembretes', s:`Receba um aviso às ${p.hora} nos seus dias de estudo.`, r:'lembretes'});
  const lid = ls('mat_notif_lidas',[]);
  return L.map(n=>Object.assign(n,{nova:!lid.includes(n.id)}));
}

      <div class="logo">${LOGO}<span>Plano <b>ENEM</b></span></div>

      <div class="selos"><span>${ic('cadeado',1.8)}Dados protegidos</span><span>${ic('celular',1.8)}Funciona no celular</span><span>${ic('nuvem',1.8)}Progresso salvo</span></div>
    </div></div>`;
  const olho=document.getElementById('lOlho');
  if(olho) olho.onclick=()=>{ const i=document.getElementById('lSenha'); const ver=i.type==='password'; i.type=ver?'text':'password'; olho.innerHTML=ic(ver?'olho':'olhoX',1.8); };
  if(keep.nome && document.getElementById('lNome')) document.getElementById('lNome').value=keep.nome;
  if(keep.email) document.getElementById('lEmail').value=keep.email;

const CURSOS = [['🩺','Medicina'],['⚖️','Direito'],['🛠️','Engenharias'],['🧠','Psicologia'],['💉','Enfermagem e saúde'],['📈','Administração ou Economia'],['🍎','Pedagogia e licenciaturas'],['✨','Outro curso']];
const METAS = [['🚀','Acima de 800'],['🎯','De 700 a 800'],['📈','De 600 a 700'],['✅','Até 600'],['🤔','Ainda não sei']];

const PERIODOS = [['🌅','Manhã','08:00'],['☀️','Tarde','14:00'],['🌙','Noite','19:00']];
let ob = null;
function iniciarOnboarding(editar){
  const p = perfil()||{}, q = ls('enem_quiz2',{});
  const difQuiz = (q.materias||[]).map(n=>(M.find(m=>m.nome===n||n.startsWith(m.nome))||{}).id).filter(Boolean);
  const metaQuiz = {'Acima de 800':'Acima de 800','De 700 a 800':'De 700 a 800','De 600 a 700':'De 600 a 700','Até 600 pontos':'Até 600'}[q.meta];
  const cursoQuiz = q.curso==='Enfermagem e outras da saúde'?'Enfermagem e saúde':q.curso;
  ob = { passo:0, editar:!!editar, d:{
    nome: p.nome || q.nome || Conta.nome() || '',
    curso: p.curso || (CURSOS.some(c=>c[1]===cursoQuiz)?cursoQuiz:''),
    meta: p.meta || metaQuiz || '',
    momento: p.momento || '',
    dificeis: p.dificeis || difQuiz,
    minutos: p.minutos || ({'Menos de 1 hora':45,'De 1 a 2 horas':90,'De 2 a 4 horas':120,'Mais de 4 horas':150}[q.horas]) || 0,
    dias: p.dias || [1,2,3,4,5],
    periodo: p.periodo || '',
    hora: p.hora || '19:00'

}
const PASSOS = ['nome','curso','meta','momento','dificeis','minutos','dias','periodo'];
function telaOnboarding(){
  nav.style.display='none';
  const d = ob.d, passo = PASSOS[ob.passo], n = PASSOS.length;
  let titulo='', sub='', corpo='', pode=true;
  const esc = (lista, campo, val)=>`<div class="esc">${lista.map(o=>`<button class="${d[campo]===o[1]?'on':''}" onclick="ob.d.${campo}='${o[1]}';${val?`ob.d.hora='${o[2]}';`:''}telaOnboarding()"><span class="e">${o[0]}</span>${S(o[1])}<span class="r"></span></button>`).join('')}</div>`;
  if(passo==='nome'){ titulo='Como você quer ser chamado(a)?'; sub='É assim que o app vai falar com você.'; corpo=`<input class="inp" id="obNome" value="${S(d.nome)}" placeholder="Seu primeiro nome" maxlength="30" autocomplete="given-name">`; }

  if(passo==='meta'){ titulo='Qual nota você quer tirar?'; sub='A sua meta define o ritmo do plano.'; corpo=esc(METAS,'meta'); pode=!!d.meta; }
  if(passo==='momento'){ titulo='Como você está em relação à prova?'; sub='Assim o plano equilibra conteúdo novo e revisão.'; corpo=esc(MOMENTOS,'momento'); pode=!!d.momento; }
  if(passo==='dificeis'){ titulo='Em quais matérias você tem mais dificuldade?'; sub='Escolha até 4. Elas vão aparecer com mais frequência no seu plano.';
    corpo=`<div class="grade-mat">${M.map(m=>`<button class="${d.dificeis.includes(m.id)?'on':''}" onclick="togDif('${m.id}')">${ic(m.id,1.7)}<span>${S(m.nome)}</span></button>`).join('')}</div>`; }
  if(passo==='minutos'){ titulo='Quanto tempo por dia você consegue estudar?'; sub='Seja realista: é melhor cumprir 45 minutos do que abandonar 3 horas.';
    corpo=`<div class="esc">${[[30,'⚡','Rápido e constante'],[45,'🙂','Leve'],[60,'📘','Equilibrado'],[90,'💪','Puxado'],[120,'🔥','Intenso'],[150,'🚀','Reta final total']].map(o=>`<button class="${d.minutos===o[0]?'on':''}" onclick="ob.d.minutos=${o[0]};telaOnboarding()"><span class="e">${o[1]}</span><div><b style="display:block;">${fmtMin(o[0])} por dia</b><span style="font-size:12.5px;color:var(--cinza);font-weight:500;">${o[2]}</span></div><span class="r">${d.minutos===o[0]?'✓':''}</span></button>`).join('')}</div>`; pode=!!d.minutos; }
  if(passo==='dias'){ titulo='Em quais dias da semana?'; sub='Os outros dias ficam livres para descansar.';
    corpo=`<div class="chips">${ORDEM_SEMANA.map(x=>`<button class="${d.dias.includes(x)?'on':''}" onclick="togDia(${x})">${DIAS_LONGO[x]}</button>`).join('')}</div>`; pode=d.dias.length>0; }
  if(passo==='periodo'){ titulo='Qual é o melhor horário para você?'; sub='É quando o lembrete vai chegar.';
    corpo=esc(PERIODOS,'periodo',true)+`<div class="campo" style="margin-top:16px;"><label for="obHora">Horário exato</label><input class="inp" id="obHora" type="time" value="${S(d.hora)}"></div>`; pode=!!d.periodo; }
  app.innerHTML = `<div class="ob">
    <div class="ob-top">${ob.passo>0||ob.editar?`<button class="voltar" onclick="voltarOb()" aria-label="Voltar">${ic('volta',2.2)}</button>`:''}<div class="ob-prog"><i style="width:${(ob.passo+1)/n*100}%"></i></div><span class="ob-passo">${ob.passo+1}/${n}</span></div>
    <div class="corpo fade"><h2>${titulo}</h2><p class="sub">${sub}</p>${corpo}</div>
    <button class="btn" id="obOk" ${pode?'':'disabled'} style="margin-top:20px;">${ob.passo===n-1?'Montar meu plano':'Continuar'}</button>

  const nm=document.getElementById('obNome'); if(nm){ nm.focus(); nm.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('obOk').click(); }); }
  document.getElementById('obOk').onclick=()=>{
    if(passo==='nome'){ ob.d.nome = (nm.value.trim()||'Estudante'); }
    if(passo==='periodo'){ ob.d.hora = document.getElementById('obHora').value || ob.d.hora; }
    if(ob.passo<n-1){ ob.passo++; telaOnboarding(); window.scrollTo(0,0); } else telaGerando();

}
function voltarOb(){ if(ob.passo===0){ ob=null; irPara('perfil'); render(); return; } ob.passo--; telaOnboarding(); }
function togDif(id){ const a=ob.d.dificeis; ob.d.dificeis = a.includes(id) ? a.filter(x=>x!==id) : (a.length>=4 ? [...a.slice(1),id] : [...a,id]); telaOnboarding(); }
function togDia(x){ const a=ob.d.dias; ob.d.dias = a.includes(x) ? a.filter(y=>y!==x) : [...a,x]; telaOnboarding(); }
function telaGerando(){
  const etapas = ['Analisando as suas matérias','Distribuindo o tempo na semana','Priorizando os temas que mais caem','Encaixando revisões e redação'];
  app.innerHTML = `<div class="ob"><div class="gerando"><div class="logo logo-esc">${LOGO}<span>Plano <b>ENEM</b></span></div>${anel(0,'0%','montando','', '')}<h2 style="margin-top:22px;">Montando o seu plano, ${S(ob.d.nome.split(' ')[0])}...</h2><div class="passos-ger">${etapas.map((e,i)=>`<div id="pg${i}"><i></i>${e}</div>`).join('')}</div></div></div>`;
  const t0=performance.now(), DUR=3200;
  (function tick(now){
    const t=Math.min(1,(now-t0)/DUR), e=t*t*(3-2*t), pct=Math.round(e*100);
    const a=app.querySelector('.anel'); if(!a) return;
    a.outerHTML; a.querySelectorAll('circle')[1].setAttribute('stroke-dashoffset', 2*Math.PI*42*(1-pct/100)); a.querySelector('b').textContent=pct+'%';
    etapas.forEach((_,i)=>{ if(pct>=(i+1)*24){ const el=document.getElementById('pg'+i); if(el && !el.classList.contains('ok')){ el.classList.add('ok'); el.querySelector('i').textContent='✓'; } } });
    if(t<1) requestAnimationFrame(tick); else setTimeout(salvarPerfil, 350);
  })(performance.now());
}
function salvarPerfil(){
  const ant = perfil();

  const editar = ob.editar; ob=null;
  telaPlanoPronto(editar);
}

function acharTema(id){ let r=null; M.forEach(m=>m.temas.forEach(t=>{ if(t.id===id) r=t; })); return r; }
/* os temas de cada bloco ficam guardados no dia, para o tema concluído não sumir da tela */
function temasDoBloco(iso,i,b,gravar){
  if(b.m==='revisao') return [];
  const A=ls('mat_atrib',{}), d=A[iso]||{};
  if(d[i]) return d[i].map(acharTema).filter(Boolean);
  const m=mat(b.m); if(!m) return [];
  const usados=[].concat(...Object.values(d)), L=lidos();
  const lista=m.temas.filter(t=>!L.includes(t.id)&&!usados.includes(t.id)).slice(0,temasPorBloco(b));   /* na ordem do material */
  if(gravar && lista.length){
    d[i]=lista.map(t=>t.id); A[iso]=d;
    Object.keys(A).sort().slice(0,-21).forEach(k=>delete A[k]);
    lsSet('mat_atrib',A);
  }
  return lista;
}
function concluirTemaPlano(id){

}

/* cronômetro global: um só relógio, que aparece no card do Plano, na tela cheia ou fixo no topo em qualquer aba */
const tmGet = ()=>ls('mat_timer',null);
const tmSeg = t=>t ? t.acumulado+(t.inicio?(Date.now()-t.inicio)/1000:0) : 0;
const tmAtivo = t=>!!(t && (t.inicio || t.acumulado>0));
const tmFmt = sg=>String(Math.floor(sg/60)).padStart(2,'0')+':'+String(Math.floor(sg)%60).padStart(2,'0');
const TM_PLAY = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';
const TM_PAUSE = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor"/></svg>';
function tmIniciar(mid,min){
  let t=tmGet();
  if(tmAtivo(t) && t.m!==mid){ if(!confirm('Você já tem um cronômetro de '+nomeBloco(t.m)+' em andamento. Descartar e começar o novo?')) return false; t=null; }
  if(!t || t.m!==mid) t={m:mid,min:min,acumulado:0,inicio:null};
  t.min=min; if(!t.inicio) t.inicio=Date.now();
  lsSet('mat_timer',t); tmTick(); return true;
}
function tmAlternar(){
  const t=tmGet(); if(!t) return;
  if(t.inicio){ t.acumulado=tmSeg(t); t.inicio=null; } else t.inicio=Date.now();
  lsSet('mat_timer',t); tmTick();
}
function tmFim(){
  const t=tmGet(); if(!t) return;
  const min=Math.round(tmSeg(t)/60), mid=t.m; lsSet('mat_timer',null);
  const emTela=(location.hash||'').startsWith('#timer');
  if(min<1) toast('Menos de 1 minuto: nada foi salvo.');
  else {

  const p=perfil(); if(!p||!('Notification' in window)||Notification.permission!=='granted') return;
  const ag=new Date(), hm=String(ag.getHours()).padStart(2,'0')+':'+String(ag.getMinutes()).padStart(2,'0');
  if(!p.dias.includes(ag.getDay())||hm!==p.hora) return;
  const ch=hojeISO()+p.hora; if(ls('mat_ult_lembrete','')===ch) return; lsSet('mat_ult_lembrete',ch);
  const corpo=(p.plano[ag.getDay()]||[]).map(b=>nomeBloco(b.m)).join(' + ')||'Abra o seu plano de estudos.';
  if(navigator.serviceWorker&&navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r=>r.showNotification('📚 Hora de estudar, '+primeiroNome()+'!',{body:'Hoje: '+corpo,icon:'/shared/icone.svg'})).catch(()=>{});
  else new Notification('📚 Hora de estudar!',{body:corpo});
}
setInterval(checaLembrete,30000);

/* ===================== EXERCÍCIOS (order bump) ===================== */
let sQ=null;
function bloqueado(prod,titulo,texto){ return `<div class="card bloq"><div class="e">🔒</div><h2>${titulo}</h2><p>${texto}</p><button class="btn" onclick="checkout('${prod}')">Desbloquear agora</button><button class="btn sec" onclick="irPara('codigo')">Já comprei: inserir código</button></div>`; }
function telaExercicios(){
  if(!Acesso.tem('exercicios')){ app.innerHTML = barraTopo('📝 Exercícios e simulados', !!perfil())+`<div class="tela">${bloqueado('exercicios','Exercícios e simulados','Pratique com questões no estilo do ENEM, com a explicação de cada resposta, e faça simulados cronometrados.')}</div>`; return; }
  const R=respostas(), p=perfil();
  const ordem = M.slice().sort((a,b)=>((p&&p.dificeis.includes(b.id))?1:0)-((p&&p.dificeis.includes(a.id))?1:0));
  app.innerHTML = `${barraTopo('📝 Exercícios e simulados', !!perfil())}
  <div class="tela fade">
    <div class="card hero"><div class="k">Mini simulado</div><div class="grande" style="font-size:22px;">10 questões, cronometrado</div><p>Todas as matérias. O resultado entra no seu progresso.</p><div style="height:12px"></div><button class="btn sec" style="background:var(--card);" onclick="iniciarQ('simulado')">Começar simulado</button></div>
    <div class="secao">Treinar por matéria</div>
    ${ordem.map(m=>{ const qs=Q.map((q,i)=>({q,i})).filter(x=>x.q.m===m.id); if(!qs.length) return ''; const f=qs.filter(x=>x.i in R).length; return `<button class="tema-item" onclick="iniciarQ('treino','${m.id}')"><span class="ck" style="background:${COR_MAT[m.id]};border:none;font-size:15px;">${m.icone}</span><div style="flex:1;"><b>${S(m.nome)}</b><span class="nota">${f}/${qs.length} feitas${p&&p.dificeis.includes(m.id)?' · sua prioridade':''}</span></div><span class="seta">${ic('chevR',2.2)}</span></button>`; }).join('')}
    <button class="btn sec" onclick="irPara('erros')">📒 Caderno de erros</button>
    <p class="legal">Questões originais, elaboradas no estilo do ENEM para treino. Não são questões oficiais.</p>
  </div>`;
}
function embaralhar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function iniciarQ(modo, filtro, tema){
  let idx=Q.map((q,i)=>i);
  if(modo==='erros'){ const R=respostas(); idx=idx.filter(i=>R[i]===false); modo='treino'; }
  else if(tema) idx=idx.filter(i=>Q[i].t===tema); else if(filtro) idx=idx.filter(i=>Q[i].m===filtro);
  idx=embaralhar(idx); if(modo==='simulado') idx=idx.slice(0,10);
  if(!idx.length){ toast('Nenhuma questão aqui ainda.'); return; }
  sQ={lista:idx,i:0,acertos:0,modo,inicio:Date.now(),marcadas:{}}; irPara('questao');
}
function telaQuestao(){
  if(!sQ){ irPara('exercicios'); return; }
  const s=sQ; if(s.i>=s.lista.length) return telaFimQ();
  const qi=s.lista[s.i], q=Q[qi], mk=s.marcadas[qi], mostra=mk!==undefined&&s.modo==='treino';
  app.innerHTML = `${barraTopo((s.modo==='simulado'?'Simulado':'Treino')+' · '+(s.i+1)+'/'+s.lista.length,true)}
  <div class="tela fade"><div class="card">
    <div class="barra fina" style="margin:0 0 12px;"><i style="width:${s.i/s.lista.length*100}%"></i></div>
    <span class="tag azul">${mat(q.m).icone} ${S(mat(q.m).nome)}</span>
    <p class="q-enun">${S(q.e)}</p>
    ${q.a.map((a,j)=>`<button class="alt${mostra&&j===q.c?' ok':''}${mostra&&j===mk&&j!==q.c?' no':''}" ${mk!==undefined?'disabled':''} onclick="responder(${j})"><b>${'ABCDE'[j]}</b><span>${S(a)}</span></button>`).join('')}
    ${mostra?`<div class="explic"><b>${mk===q.c?'✅ Você acertou! +10 XP':'❌ Resposta correta: '+'ABCDE'[q.c]}</b><br>${S(q.x)}</div>`:''}
  </div>${mk!==undefined?`<button class="btn" onclick="sQ.i++;telaQuestao();window.scrollTo(0,0);">${s.i+1<s.lista.length?'Próxima →':'Ver resultado'}</button>`:''}</div>`;
}
function responder(j){
  const s=sQ, qi=s.lista[s.i], q=Q[qi]; s.marcadas[qi]=j; const ok=j===q.c; if(ok) s.acertos++;
  const R=respostas(); R[qi]=ok; lsSet('mat_resp',R);
  const rd=respDia(); rd[hojeISO()]=(rd[hojeISO()]||0)+1; lsSet('mat_resp_dia',rd); marcarDiaAtivo();
  if(s.modo==='simulado') s.i++;
  telaQuestao();
}
function telaFimQ(){
  const s=sQ, min=Math.max(1,Math.round((Date.now()-s.inicio)/60000));
  if(s.modo==='simulado'){ const reg=sessoes(); reg.push({d:hojeISO(),m:'revisao',min}); lsSet('mat_tempo',reg); }
  const pct=Math.round(s.acertos/s.lista.length*100);
  app.innerHTML = `${barraTopo('Resultado',false)}
  <div class="tela fade">
    <div class="card" style="text-align:center;">${anel(pct, s.acertos+'/'+s.lista.length, 'acertos', '')}<p class="nota" style="margin-top:8px;">${pct>=70?'Mandou bem! 🎉':pct>=40?'Bom caminho. Revise os erros.':'Normal no começo. Os erros mostram o que estudar.'} · ${fmtMin(min)}</p></div>
    ${s.modo==='simulado'?`<div class="secao">Gabarito</div>${s.lista.map((qi,k)=>{ const q=Q[qi], m=s.marcadas[qi]; return `<details class="acc"><summary>${m===q.c?'✅':'❌'} ${k+1}. ${S(mat(q.m).nome)}</summary><div class="ct"><p class="q-enun">${S(q.e)}</p><p><b>Sua:</b> ${'ABCDE'[m]} · <b>Correta:</b> ${'ABCDE'[q.c]}</p><div class="explic">${S(q.x)}</div></div></details>`; }).join('')}`:''}
    <button class="btn" onclick="sQ=null;irPara('exercicios')">Voltar aos exercícios</button>
    <button class="btn sec" onclick="sQ=null;irPara('progresso')">Ver meu progresso</button>
  </div>`;
}

/* ===================== roteador ===================== */
function irPara(r){ if(location.hash==='#'+r) render(); else location.hash=r; }
function sairConta(){ Conta.sair().then(()=>{ diaSel=null; location.hash=''; render(); }); }
function render(){
  if(Conta.ativo && Conta.recuperando){ nav.style.display='none'; Conta.telaNovaSenha(app,'Plano ENEM',()=>{ Conta.recuperando=false; toast('Senha salva!'); render(); }); return; }
  if(Conta.ativo && !Conta.usuario()){ telaLogin(); return; }
  const r=(location.hash||'#inicio').slice(1), pt=r.split('/');
  const temPlano=Acesso.tem('plano'), temEx=Acesso.tem('exercicios');
  if(pt[0]==='codigo' || (!temPlano && !temEx)){ telaCodigo(); return; }
  if(!temPlano){ nav.style.display='none'; if(pt[0]==='questao') return telaQuestao(); if(pt[0]==='erros') return telaErros(); if(pt[0]==='treino') return iniciarQ('treino',null,pt[2]); return telaExercicios(); }
  if(!perfil()){ if(!ob) iniciarOnboarding(false); else telaOnboarding(); return; }
  { const pf=perfil(); if(pf.planoV!==2){ pf.plano=gerarPlano(pf); pf.planoV=2; lsSet('mat_perfil',pf); const A=ls('mat_atrib',{}), h=hojeISO(); Object.keys(A).forEach(k=>{ if(k>=h) delete A[k]; }); lsSet('mat_atrib',A); } }
  nav.style.display='';
  const aba = {inicio:'inicio',notificacoes:'inicio',timer:'plano',ajustar:'plano',plano:'plano',resumos:'resumos',materia:'resumos',tema:'resumos',progresso:'progresso',erros:'progresso'}[pt[0]] || 'perfil';
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.r===aba));
  const T = { material:()=>telaMaterialDoc(pt[1]), ajustar:telaAjustar, plano:telaPlano, resumos:telaResumos, progresso:telaProgresso, perfil:telaPerfil, notificacoes:telaNotificacoes, lembretes:telaLembretes, materiais:telaMateriais, exercicios:telaExercicios, questao:telaQuestao, erros:telaErros };
  if(pt[0]==='materia') telaMateria(pt[1]);
  else if(pt[0]==='tema') telaTema(pt[1]);
  else if(pt[0]==='timer') telaTimer(pt[1], +pt[2]||30);
  else if(pt[0]==='treino'){ if(!temEx) telaExercicios(); else iniciarQ('treino',null,pt[2]); return; }
  else (T[pt[0]]||telaInicio)();
  window.scrollTo(0,0);
}
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(b.dataset.r==='plano') diaSel=null; irPara(b.dataset.r); });
window.addEventListener('hashchange', render);
window.addEventListener('hashchange', ()=>setTimeout(tmTick,0));
(async()=>{
  let lib=[];
  try{ lib=await Conta.iniciar(); }catch(e){ console.error(e); toast(e.message); }
  lib=lib.concat(await Acesso.lerDaUrl());
  if(lib.length) setTimeout(()=>toast('Acesso liberado! 🎉'),300);
  render();
})();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
</script>
