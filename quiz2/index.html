<script>
/* =========================================================
   CONFIGURAÇÃO DO QUIZ 2 (MATÉRIAS)
   ========================================================= */
window.QUIZ = {
  id: 'quiz2',
  MARCA: 'Teste de Preparo ENEM',
  SUB: 'Você está preparado para o ENEM?',
  APP_NOME: 'Plano ENEM',
  PIXEL_ID: '',
  GA_ID: '',
  CHECKOUT_URL: '',             // checkout do aplicativo das matérias
  CHECKOUT_DESCONTO: '',        // opcional: pop-up de saída. Vazio = desligado
  PRECO_POR: 'R$ 24,90',        // provisório
  PRECO_DESCONTO: '',
  DATA_ENEM: '2026-11-08'       // CONFIRME no edital do INEP
};

/* nota de corte média aproximada em federais (SISU, edições anteriores). VALIDAR com dados oficiais antes de anunciar. */
const CURSOS = {
  'Medicina':'780 a 820', 'Direito':'700 a 750', 'Engenharias':'650 a 720', 'Psicologia':'680 a 730',
  'Enfermagem e outras da saúde':'600 a 680', 'Administração ou Economia':'600 a 680', 'Pedagogia e licenciaturas':'540 a 620', 'Outro curso':null
};

const QUESTIONS = [
  { id:'situacao', type:'foto',
    options:['Estou no 3º ano do ensino médio','Já terminei e estudo por conta própria','Faço cursinho / pré-vestibular','Já fiz o ENEM e vou tentar de novo'],
    images:['/img/situacao-3ano.jpg','/img/situacao-sozinho.jpg','/img/situacao-cursinho.jpg','/img/situacao-tentar-de-novo.jpg'] },
  { id:'sentimento', question:'Faltando tão pouco, como você se sente agora?',
    options:['😰 Desesperado(a): sinto que não vai dar tempo','🌀 Perdido(a): não sei nem por onde começar','😟 Ansioso(a): estudo, mas não sei se é o suficiente','🙂 Tranquilo(a), mas quero garantir o máximo'] },
  { id:'horas', question:'Quanto tempo você estuda por dia, em média?',
    options:['Não estou estudando','Menos de 1 hora','De 1 a 2 horas','De 2 a 4 horas','Mais de 4 horas'] },
  { id:'dias', question:'Quantos dias por semana você realmente estuda?',
    options:['Quase nenhum','1 a 2 dias','3 a 4 dias','5 a 6 dias','Todos os dias'] },
  { id:'rotina', question:'Como está a sua rotina de estudos?',
    options:['Não tenho rotina, estudo quando dá','Tenho cronograma, mas não consigo cumprir','Estudo bastante, mas sem saber o que priorizar','Tenho uma rotina organizada'] },
  { id:'tentou', question:'Você já montou um cronograma e abandonou no meio do caminho?',
    options:['Sim, várias vezes','Sim, uma vez','Nunca montei um','Não, sempre cumpro'] },
  { id:'materias', type:'multi', max:4, question:'Em quais matérias você tem mais dificuldade?',
    options:['Matemática','Física','Química','Biologia','História','Geografia','Filosofia','Sociologia','Linguagens','Redação'] },
  { id:'resumos', question:'Você sabe quais são os temas que mais caem em cada matéria?',
    options:['Não faço ideia','Sei de alguns, mas estudo tudo igual','Sei, mas não tenho resumo deles','Sei e tenho resumos organizados'] },
  { id:'simulados', question:'Quando foi o seu último simulado completo do ENEM?',
    options:['Nunca fiz um','Há mais de 3 meses','No último mês','Faço toda semana'] },
  { id:'curso', question:'Qual curso você quer fazer?', options:Object.keys(CURSOS) },
  { id:'meta', question:'Qual nota você precisa tirar para passar?',
    sub:a=>{ const c=CURSOS[a.curso]; return c ? `Para ${S(a.curso)}, a nota de corte nas federais costuma ficar na faixa de <strong>${c} pontos</strong> (valor aproximado de edições anteriores do SISU; muda conforme a universidade).` : ''; },
    options:['Até 600 pontos','De 600 a 700','De 700 a 800','Acima de 800','Não sei qual é a minha meta'] },
  { id:'red_nota', question:'E na redação, como você está?',
    options:['Nunca escrevi uma redação completa','Não sei, ninguém corrige','Tiro menos de 500','Tiro entre 500 e 700','Tiro entre 700 e 800','Tiro mais de 800'] },
  { id:'atrapalha', question:'O que mais atrapalha você de estudar?',
    options:['Falta de tempo','Celular e distrações','Não saber o que estudar hoje','Ansiedade e cansaço','Desmotivação'] },
  { id:'ajuda', question:'O que mais ajudaria você a manter o foco e render no último mês?',
    options:['📅 Um plano pronto para saber o que estudar em menos de 30 dias','📚 Resumos do que mais cai em cada matéria','📊 Ver o meu desempenho por matéria e saber onde melhorar','⏰ Lembretes e um aplicativo que me puxa para estudar','✅ Todas as alternativas acima'] }
];

function montaFlow(){
  QUESTIONS.forEach(q=>FLOW.push({type:'question', q}));
  FLOW.push({type:'analyzing', label:'Calculando o seu Índice de Preparo...', dur:5000});
  FLOW.push({type:'diag'});
  FLOW.push({type:'app'});
  FLOW.push({type:'analyzing', label:'Montando o seu plano personalizado...', dur:3500});
  FLOW.push({type:'projecao'});
  FLOW.push({type:'result'});
}

/* =========================================================
   ÍNDICE DE PREPARO (sempre entre 14 e 38, decisão do dono do funil)
   ========================================================= */
function opts(id){ return QUESTIONS.find(q=>q.id===id).options; }
function calcPreparo(){
  const a = state.answers;
  const horas = pts(a.horas, opts('horas')) / 4;
  const dias  = pts(a.dias,  opts('dias')) / 4;
  const rot   = pts(a.rotina,opts('rotina')) / 3;
  const tent  = pts(a.tentou,opts('tentou')) / 3;
  const resu  = pts(a.resumos,opts('resumos')) / 3;
  const simu  = pts(a.simulados,opts('simulados')) / 3;
  const rn    = pts(a.red_nota,opts('red_nota')) / 5;
  const raw = horas*20 + dias*15 + rot*15 + tent*5 + resu*15 + simu*15 + rn*15;   // 0..100
  /* quem está mal continua entre 14 e 24; quem está bem sobe de verdade, até cerca de 88 */
  const idx = Math.round(raw<=40 ? 14 + raw*0.24 : 23.6 + (raw-40)*1.073);
  const barra = r => Math.min(96, Math.round(8 + r*88));
  return { idx, areas:[
    {n:'Rotina e constância', v:barra((dias*15+rot*15+tent*5)/35)},
    {n:'Tempo de estudo',     v:barra(horas)},
    {n:'Conteúdo priorizado', v:barra(resu)},
    {n:'Simulados e prática', v:barra(simu)},
    {n:'Redação',             v:barra(rn)}
  ]};
}
function nivel(i){
  return i<24 ? {txt:'MUITO BAIXO', cor:'#d64545'} : i<45 ? {txt:'BAIXO', cor:'#e0703a'} : i<65 ? {txt:'EM EVOLUÇÃO', cor:'#d99a00'} : {txt:'BOM', cor:'#1f9d63'};
}
function matsDificeis(){ return (state.answers.materias||[]).filter(m=>m!=='Redação'); }

/* plano da semana montado com as respostas */
const MIN_POR_DIA = {'Não estou estudando':45,'Menos de 1 hora':45,'De 1 a 2 horas':90,'De 2 a 4 horas':120,'Mais de 4 horas':150};
function fmt(m){ return m>=60 ? (Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')) : (m+' min'); }
const TODAS_MATS = ['Matemática','Física','Química','Biologia','História','Geografia','Filosofia','Sociologia','Linguagens','Redação'];
/* mesma lógica do aplicativo: todas as matérias entram na semana; com 6 dias de estudo, cada dia leva 2 matérias
   e o tempo é dividido entre elas. As prioritárias vêm primeiro e se repetem mais. */
function montaPlano(){
  const dif = matsDificeis();
  const fila = [...dif, ...TODAS_MATS.filter(m=>!dif.includes(m))];
  const mi = MIN_POR_DIA[state.answers.horas] || 60;
  const dias = ['Seg','Ter','Qua','Qui','Sex','Sáb'], porDia = Math.ceil(fila.length/dias.length);
  const base = Math.floor(mi/porDia/5)*5; let sobra = mi - base*porDia;
  const mins = [...Array(porDia)].map(()=>{ const x = base + (sobra>=5?5:0); if(sobra>=5) sobra-=5; return x; });
  let k = 0;
  const linhas = dias.map(d=>{ const itens = mins.map(min=>({m:fila[(k++)%fila.length], min})); return {d, itens, total:mi}; });
  linhas.push({d:'Dom', itens:[{m:'Revisão da semana', min:Math.max(60,mi)}], total:Math.max(60,mi)});
  return linhas;
}

/* =========================================================
   TELAS PRÓPRIAS DO QUIZ 2
   ========================================================= */
/* carrossel de prints reais do aplicativo: desliza sozinho, pausa enquanto a pessoa segura a imagem.
   A última "foto" é cópia da primeira: ao chegar nela, volta ao início sem transição (sem salto). */
/* na versão escura (/quiz2/escuro) usa os prints do aplicativo escuro */
const SUF_IMG = document.documentElement.classList.contains('escuro') ? '-escuro' : '';
const PRINTS = ['inicio','plano','meta','resumos','tema','progresso'].map(n=>'/img/print-app-'+n+SUF_IMG+'.jpg');
let printsIdx = 0, printsTimer = null;
/* pré-carrega e decodifica tudo antes de começar, para a troca não travar */
function precarregar(lista){ lista.forEach(src=>{ const im = new Image(); im.src = src; if(im.decode) im.decode().catch(()=>{}); }); }
/* cartão ao lado do celular, com uma seta saindo da tela e um resumo dela em poucas palavras */
const CHAMADAS = [
  {t:'Início', d:'Seu dia em um olhar', y:34, lado:'dir'},
  {t:'Plano', d:'O que estudar em cada dia', y:26, lado:'esq'},
  {t:'Meta', d:'Quanto você já cobriu da semana', y:52, lado:'dir'},
  {t:'Matérias', d:'Os temas de cada uma', y:38, lado:'esq'},
  {t:'Resumo', d:'O tema, direto ao ponto', y:30, lado:'dir'},
  {t:'Progresso', d:'Seu tempo e seu desempenho', y:36, lado:'esq'}
];
const PRINTS_ORIG = PRINTS.slice(), CHAMADAS_ORIG = CHAMADAS.slice();
/* começa o carrossel pela tela que combina com a resposta da pessoa */
function ordenarPrints(ini){
  const n = PRINTS_ORIG.length;
  PRINTS.splice(0, n, ...PRINTS_ORIG.map((_,k)=>PRINTS_ORIG[(k+ini)%n]));
  CHAMADAS.splice(0, n, ...CHAMADAS_ORIG.map((_,k)=>CHAMADAS_ORIG[(k+ini)%n]));
}
function mostrarChamada(i, animar){
  const el = document.getElementById('prints-call'); if(!el) return;
  const c = CHAMADAS[i % CHAMADAS.length];
  const aplicar = ()=>{ el.className = 'print-call '+((i % CHAMADAS.length)%2===0?'dir':'esq'); el.style.top = c.y+'%'; el.querySelector('b').textContent = c.t; el.querySelector('span').textContent = c.d; };
  if(!animar){ aplicar(); return; }
  el.classList.add('apaga'); setTimeout(aplicar, 320);
}
function iniciarPrints(){ clearInterval(printsTimer); printsIdx = 0; precarregar(PRINTS); mostrarChamada(0,false); printsTimer = setInterval(avancarPrints, 2600); }
function pausarPrints(){ clearInterval(printsTimer); }
function retomarPrints(){ clearInterval(printsTimer); printsTimer = setInterval(avancarPrints, 2600); }
function avancarPrints(){
  const track = document.getElementById('prints-track');
  if(!track || !document.body.contains(track)){ clearInterval(printsTimer); return; }
  const pct = 100 / (PRINTS.length + 1);
  printsIdx++;
  track.style.transition = 'transform .7s cubic-bezier(.45,.05,.25,1)';
  track.style.transform = `translate3d(-${printsIdx * pct}%,0,0)`;
  document.querySelectorAll('#prints-dots i').forEach((d,i)=>d.classList.toggle('on', i === (printsIdx % PRINTS.length)));
  mostrarChamada(printsIdx % PRINTS.length, true);
  if(printsIdx === PRINTS.length){
    setTimeout(()=>{
      if(!document.body.contains(track)) return;
      track.style.transition = 'none'; track.style.transform = 'translate3d(0,0,0)'; printsIdx = 0;
    }, 760);

let pdfTimer = null, pdfUltimo = -1, pdfFila = [];
/* mostra uma página aleatória, sem repetir a anterior nem a mesma matéria duas vezes seguidas */
function proximaPagina(){
  if(!pdfFila.length){
    pdfFila = PAGINAS_PDF.map((_,i)=>i).sort(()=>Math.random()-0.5);
  }
  let i = pdfFila.shift();
  const mAnt = pdfUltimo>=0 ? PAGINAS_PDF[pdfUltimo].m : null;
  if(PAGINAS_PDF[i].m === mAnt && pdfFila.length){ const j = pdfFila.findIndex(k=>PAGINAS_PDF[k].m!==mAnt); if(j>=0){ pdfFila.push(i); i = pdfFila.splice(j,1)[0]; } }
  pdfUltimo = i; return PAGINAS_PDF[i];
}
/* três folhas visíveis (esquerda, meio, direita) e uma esperando à direita: a da direita vai para o meio,
   a do meio vai para a esquerda, a da esquerda sai e uma nova entra pela direita */
function pintarFolha(el, pg){
  el.querySelector('img').src = pg.s; el.querySelector('img').style.visibility = 'visible';
  el.querySelector('.pdf-leg b').textContent = pg.m; el.querySelector('.pdf-leg span').textContent = pg.t;
}
function avancarPdf(){
  const stage = document.getElementById('pdf-stage');
  if(!stage || !document.body.contains(stage)){ clearInterval(pdfTimer); return; }
  const folhas = [...stage.querySelectorAll('.pdf-sheet')];
  folhas.forEach(f=>{ f.dataset.pos = String(+f.dataset.pos - 1); });
  const saiu = folhas.find(f=>f.dataset.pos === '-2');
  setTimeout(()=>{
    if(!saiu || !document.body.contains(stage)) return;
    saiu.style.transition = 'none';
    pintarFolha(saiu, proximaPagina());
    saiu.dataset.pos = '2';
    void saiu.offsetWidth;            // aplica sem animar
    saiu.style.transition = '';
  }, 700);
}
function iniciarPdf(){
  clearInterval(pdfTimer); pdfFila = []; pdfUltimo = 0;
  /* depois da primeira página, as que a pessoa marcou como dificuldade vêm primeiro */
  const dif = matsDificeis();
  pdfFila = PAGINAS_PDF.map((_,i)=>i).filter(i=>i!==0).sort(()=>Math.random()-0.5)
    .sort((a,b)=>(dif.includes(PAGINAS_PDF[b].m)?1:0)-(dif.includes(PAGINAS_PDF[a].m)?1:0));
  const stage = document.getElementById('pdf-stage'); if(!stage) return;
  const por = pos=>stage.querySelector('.pdf-sheet[data-pos="'+pos+'"]');
  pintarFolha(por(0), PAGINAS_PDF[0]);
  [-1,1,2].forEach(pos=>pintarFolha(por(pos), proximaPagina()));
  precarregar(PAGINAS_PDF.slice(0,9).map(x=>x.s));
  pdfTimer = setInterval(avancarPdf, 1800);
}
function pausarPdf(){ clearInterval(pdfTimer); }
function retomarPdf(){ clearInterval(pdfTimer); pdfTimer = setInterval(avancarPdf, 1800); }
