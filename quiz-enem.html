<script>
/* =========================================================
   CONFIG DA OFERTA  (preencha antes de publicar)
   ========================================================= */
const APP_NOME          = 'Reta Final ENEM';     // nome provisório do app
const CHECKOUT_URL      = '';                    // link do checkout principal (Ticto etc.)
const CHECKOUT_DESCONTO = '';                    // opcional: checkout do pop-up de saída. Vazio = pop-up desligado
const PRECO_DESCONTO    = '';                    // preço mostrado no pop-up de saída (só usado se CHECKOUT_DESCONTO existir)
const PRECO_POR         = 'R$ 27,90';            // preço da oferta (provisório)
const PRECO_DE          = 'R$ 97,90';            // ancoragem: só use se for a soma real dos itens
const DATA_ENEM         = '2026-11-08';          // CONFIRME no edital do INEP. Vazio = textos sem contagem de dias

/* ===== Rastreamento (GA4 + Pixel; seguro se não estiverem carregados) ===== */
function px(evento, padrao){
  try{ if(typeof fbq==='function'){ padrao ? fbq('track', evento) : fbq('trackCustom', evento); } }catch(e){}
}
function track(evento, params){
  try{ if(typeof gtag==='function') gtag('event', evento, params||{}); }catch(e){}
  try{ if(typeof fbq==='function') fbq('trackCustom', evento, params||{}); }catch(e){}
}
const track_estado = { etapa:0, rotulo:'intro', concluiu:false, respondidas:0 };
function trackEtapa(step){
  let num = 0, rotulo = step.type;
  if(step.type==='question'){ num = step.q.num; rotulo = step.q.id; }
  else { num = track_estado.etapa; }
  track_estado.etapa  = Math.max(track_estado.etapa, num);
  track_estado.rotulo = rotulo + (step.id ? ':'+step.id : '');
  if(step.type==='result') track_estado.concluiu = true;
  track('quiz_etapa', { etapa:num, etapa_id:track_estado.rotulo, tipo:step.type, posicao:state.idx, total_perguntas:TOTAL_Q });
}
function trackResposta(qid, valor){
  track_estado.respondidas++;
  const q = QUESTIONS.find(x=>x.id===qid);
  track('quiz_resposta', { pergunta:qid, etapa:q?q.num:0, resposta: Array.isArray(valor) ? valor.join(' | ') : String(valor) });
}
window.addEventListener('pagehide', function(){
  if(track_estado.concluiu) return;
  track('quiz_abandono', { etapa:track_estado.etapa, etapa_id:track_estado.rotulo, respondidas:track_estado.respondidas });
});

/* ===== util ===== */
function S(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function diasEnem(){
  if(!DATA_ENEM) return null;
  const d = Math.ceil((new Date(DATA_ENEM+'T09:00:00') - new Date())/86400000);
  return (isFinite(d) && d>0) ? d : null;
}
function prazoTxt(){ const d = diasEnem(); return d ? `Faltam ${d} dias para o ENEM` : 'O ENEM está chegando'; }

    if(t<1) requestAnimationFrame(tick);
  })(performance.now());

}

/* =========================================================
   ÍNDICE DE PREPARO
   Calculado a partir das respostas, mas comprimido numa faixa
   baixa (14 a 38): o teste sempre acusa que falta preparo.
   ========================================================= */
function pts(ans, tabela){ const i = tabela.indexOf(ans); return i<0 ? 0 : i; }
function calcPreparo(){
  const a = state.answers;
  const horas = pts(a.horas, ['Não estou estudando','Menos de 1 hora','De 1 a 2 horas','De 2 a 4 horas','Mais de 4 horas']) / 4;       // 0..1
  const dias  = pts(a.dias,  ['Quase nenhum','1 a 2 dias','3 a 4 dias','5 a 6 dias','Todos os dias']) / 4;
  const rot   = pts(a.rotina,['Não tenho rotina, estudo quando dá','Tenho cronograma, mas não consigo cumprir','Estudo bastante, mas sem saber o que priorizar','Tenho uma rotina organizada']) / 3;
  const tent  = pts(a.tentou,['Sim, várias vezes','Sim, uma vez','Nunca montei um','Não, sempre cumpro']) / 3;
  const simu  = pts(a.simulados,['Nunca fiz um','Há mais de 3 meses','No último mês','Faço toda semana']) / 3;
  const rn    = pts(a.red_nota,['Nunca escrevi uma redação completa','Não sei, ninguém corrige','Tiro menos de 500','Tiro entre 500 e 700','Tiro entre 700 e 800','Tiro mais de 800']) / 5;
  const rc    = pts(a.red_corr,['Ninguém corrige','Eu mesmo(a), comparando com modelos','Professor, mas demora semanas','Já usei algum site ou ferramenta']) / 3;
  const raw = (horas*20 + dias*15 + rot*15 + tent*5 + simu*15 + rn*20 + rc*10);                 // 0..100
  const idx = Math.round(14 + raw*0.24);                                                         // 14..38
  /* barras por área: também sempre baixas (8% a 46%) */
  const barra = r => Math.min(46, Math.round(8 + r*38));
  return {
    idx,
    areas:[
      {n:'Redação',        v:barra((rn*20+rc*10)/30)},
      {n:'Rotina e constância', v:barra((dias*15+rot*15+tent*5)/35)},
      {n:'Tempo de estudo',v:barra(horas)},
      {n:'Simulados e prática', v:barra(simu)}
    ]
  };
}
function nivelPreparo(i){ return i<24 ? {txt:'MUITO BAIXO', cor:'#d64545'} : {txt:'BAIXO', cor:'#e0703a'}; }

}

/* ---------- PROJEÇÃO: O DESEMPENHO DELA USANDO O APP ---------- */
const MIN_POR_DIA = {'Não estou estudando':45,'Menos de 1 hora':45,'De 1 a 2 horas':90,'De 2 a 4 horas':120,'Mais de 4 horas':150};
function montaPlano(){
  const a = state.answers;
  let mats = (a.materias||[]).filter(m=>m!=='Redação');
  ['Matemática','Interpretação de texto','Biologia','História'].forEach(m=>{ if(mats.length<4 && !mats.includes(m)) mats.push(m); });
  mats = mats.slice(0,4);
  const mi = MIN_POR_DIA[a.horas] || 60;
  const fmt = m => m>=60 ? (Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')) : (m+' min');
  return [
    {d:'Seg', m:mats[0], t:fmt(mi)},
    {d:'Ter', m:'Redação: 1 texto + correção por foto', t:fmt(mi), r:true},
    {d:'Qua', m:mats[1], t:fmt(mi)},
    {d:'Qui', m:'Redação: reescrita do ponto fraco', t:fmt(Math.max(45,Math.round(mi*0.7))), r:true},
    {d:'Sex', m:mats[2], t:fmt(mi)},
    {d:'Sáb', m:mats[3], t:fmt(mi)},
    {d:'Dom', m:'Mini simulado + revisão dos erros', t:fmt(Math.max(60,mi))}
  ];
}

<div class="saida-overlay" id="saida-overlay" role="dialog" aria-modal="true" aria-labelledby="saida-titulo">
  <div class="saida-modal">
    <button class="saida-fechar" id="saida-fechar" aria-label="Fechar">&times;</button>
    <div class="saida-selo">Espere um segundo</div>
    <h3 class="saida-titulo" id="saida-titulo">Uma condição especial para você começar hoje</h3>
    <p class="saida-sub">Esta condição aparece só uma vez. Fechando a janela, o preço volta ao normal.</p>
    <div class="saida-de" id="saida-de"></div>
    <div class="saida-val" id="saida-val"></div>
    <a href="#" class="btn" id="saida-btn">Quero com desconto &rarr;</a>
    <button class="saida-recusa" id="saida-recusa">Não quero o desconto</button>
  </div>
</div>
<script>
(function(){
  if(!CHECKOUT_DESCONTO) return;
  const overlay = document.getElementById('saida-overlay');
  document.getElementById('saida-de').textContent = 'De ' + PRECO_POR;
  document.getElementById('saida-val').textContent = PRECO_DESCONTO;
  let armado=false, usado=false;
  const jaExibido = ()=>{ try{return sessionStorage.getItem('enem_saida')==='1';}catch(e){return false;} };
  const naOferta = ()=>{ try{return FLOW[state.idx] && FLOW[state.idx].type==='result';}catch(e){return false;} };
  function armar(){ if(armado||usado||jaExibido()||!naOferta()) return; try{history.pushState({e:1},'');armado=true;}catch(e){} }
  function abrir(){
    overlay.classList.add('aberto'); document.body.style.overflow='hidden'; usado=true;
    try{sessionStorage.setItem('enem_saida','1');}catch(e){}
    px('ExitOffer');
  }
  function fechar(){ overlay.classList.remove('aberto'); document.body.style.overflow=''; }
  window.addEventListener('popstate',()=>{ if(usado||jaExibido()||!armado) return; abrir(); });
  ['pointerdown','mousedown','click','touchstart','keydown'].forEach(e=>window.addEventListener(e,armar,{passive:true}));
  document.getElementById('saida-btn').addEventListener('click',e=>{ e.preventDefault(); px('ExitOfferClick'); window.location.href=CHECKOUT_DESCONTO; });
  /* quem volta do checkout cai de novo aqui */
  window.addEventListener('pageshow',()=>{
    let v=false; try{v=sessionStorage.getItem('enem_check')==='1';}catch(e){}
    if(!v) return; try{sessionStorage.removeItem('enem_check');}catch(e){}
    if(!jaExibido()) setTimeout(abrir,400);
  });
  document.getElementById('saida-fechar').addEventListener('click',fechar);
  document.getElementById('saida-recusa').addEventListener('click',fechar);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) fechar(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&overlay.classList.contains('aberto')) fechar(); });
})();
</script>
